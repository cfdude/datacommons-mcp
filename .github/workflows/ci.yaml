name: Run CI Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-checks:
    runs-on: ubuntu-latest

    # Run lint, type-check, and tests on every supported Python version.
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # Install all dependencies including dev extras (ruff, pytest, mypy)
        run: uv sync --extra dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Type-check with mypy
        run: uv run mypy src/datacommons_mcp

      - name: Run tests with coverage (excluding e2e)
        # Always run — no conditional skip — with the coverage floor.
        run: uv run pytest -m "not e2e" --cov=datacommons_mcp --cov-fail-under=80

  # Smoke-test the Claude Desktop extension's FIRST-LAUNCH editable build
  # (the step that broke macOS+Windows after the src/ migration). Packaging alone
  # never exercised it; this assembles the flattened bundle and runs the actual
  # `uv run --frozen` editable build + import.
  extension-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Assemble the extension bundle (no mcpb pack needed)
        run: bash build-extension.sh --no-pack

      - name: Verify the bundle's first-launch editable build
        run: uv run --frozen --project build python -c "import datacommons_mcp; print(datacommons_mcp.__version__)"
