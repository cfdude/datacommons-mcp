name: Run CI Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci-checks:
    runs-on: ubuntu-latest

    # Run tests on python 3.11 and 3.12
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for changed test paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            run_tests:
              - 'datacommons_mcp/**'
              - 'tests/**'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        # Install all dependencies including dev extras (ruff, pytest)
        run: uv sync --extra dev

      - name: Check formatting with Ruff
        # The --check flag will fail if the code is not formatted correctly
        run: uv run ruff format --check

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Run tests with pytest. Skip eval tests.
        # Run unit tests if code in the datacommons-mcp package or tests directory changed
        if: steps.filter.outputs.run_tests == 'true'
        run: uv run pytest -k "not eval"
