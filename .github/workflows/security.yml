name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am

jobs:
  trivy:
    uses: cfdude/.github/.github/workflows/security-trivy.yml@6643615798a1b4737eca6f52e583a2b03abc343d # main
    permissions:
      contents: read
      security-events: write

  semgrep:
    uses: cfdude/.github/.github/workflows/security-semgrep.yml@6643615798a1b4737eca6f52e583a2b03abc343d # main
    permissions:
      contents: read
      security-events: write
