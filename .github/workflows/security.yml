name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am

jobs:
  trivy:
    uses: cfdude/.github/.github/workflows/security-trivy.yml@d5d060809c6cd951e79a92e7069a8f719c7f6074 # main
    permissions:
      contents: read
      security-events: write

  semgrep:
    uses: cfdude/.github/.github/workflows/security-semgrep.yml@d5d060809c6cd951e79a92e7069a8f719c7f6074 # main
    permissions:
      contents: read
      security-events: write
