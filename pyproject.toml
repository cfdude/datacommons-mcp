[project]
name = "datacommons-mcp"
dynamic = ["version"]
description = "Data Commons MCP server."
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "fastmcp>=3.4,<4",
    "httpx>=0.24.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "datacommons-client>=2.1.6,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "cryptography>=46.0.7,<49.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "tiktoken>=0.5.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/datacommonsorg/agent-toolkit"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0,<1.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "respx>=0.20.0,<1.0.0",
]

[project.scripts]
datacommons-mcp = "datacommons_mcp.cli:cli"

[build-system]
requires = ["uv", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["datacommons_mcp*"]

[tool.setuptools.package-data]
datacommons_mcp = ["**/*.json"]

[tool.setuptools.dynamic]
version = {attr = "datacommons_mcp.version.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "Q",     # flake8-quotes
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file (existing code pattern)
    "B008",   # Do not perform function call in argument defaults (FastAPI uses this pattern)
    "UP007",  # Use X | Y for type annotations (prefer Optional for clarity)
    "RUF012", # Mutable class attributes (existing code pattern)
    "RUF013", # Implicit Optional (existing code pattern)
    "SIM108", # Use ternary operator (existing code pattern)
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert
    "PLR2004", # Magic value used in comparison
]
"datacommons_mcp/servers/**/*.py" = [
    "TC001",  # Application import needed at runtime
    "TC002",  # Third-party import needed at runtime
]

[tool.ruff.lint.isort]
known-first-party = ["datacommons_mcp"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
asyncio_mode = "auto"
markers = [
    "e2e: mark test as end-to-end (requires DC_API_KEY)",
    "slow: mark test as slow (large datasets)",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
